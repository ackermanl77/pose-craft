name: Release

# Builds the Windows app per runtime flavour (DirectML and CPU on hosted runners;
# CUDA needs the NVIDIA wheels' 1.5 GB and is better built locally -- see
# PoseCraft.spec), zips each build and the Blender add-on, writes SHA256SUMS
# and, for a v* tag, publishes a GitHub Release. Every build has its models
# pre-converted and bundled (scripts/convert_models.py), so it needs no
# download or network on first run.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [dml, cpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dml.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import pose_craft; print(pose_craft.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match pose_craft.__version__ $version"
          }

      - name: Install dependencies (${{ matrix.flavor }})
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          # onnxruntime-gpu, onnxruntime-directml and onnxruntime all install the same
          # `onnxruntime` module, so swap the runtime for this flavour.
          python -m pip uninstall -y onnxruntime-gpu
          if ("${{ matrix.flavor }}" -eq "dml") {
            python -m pip install -r requirements-dml.txt
          } else {
            python -m pip install onnxruntime==1.30.0
          }

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Cache the downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/pose_craft/models
          key: pose-models-${{ hashFiles('pose_craft/estimation/landmarker.py', 'pose_craft/estimation/tflite_to_onnx.py') }}

      - name: Pre-convert the models
        run: python scripts/convert_models.py --out build/models

      - name: Third-party notices
        # Lists the packages actually being bundled; PoseCraft.spec ships the file.
        run: python scripts/third_party_notices.py

      - name: Build
        shell: pwsh
        env:
          POSECRAFT_FLAVOR: ${{ matrix.flavor }}
        run: python -m PyInstaller --noconfirm PoseCraft.spec

      - name: Smoke-test the bundled models
        shell: pwsh
        env:
          POSECRAFT_MODEL_DIR: dist/PoseCraft/_internal/models
        run: |
          python -c "from pose_craft.estimation.landmarker import bundled_onnx_paths as b; import sys; from pose_craft.estimation.landmarker import bundled_hand_onnx_path as h; missing = [v for v in ('lite', 'full', 'heavy') if b(v) is None] + ([] if h() else ['hand']); sys.exit(f'missing bundled models: {missing}' if missing else 0)"

      - name: Self-test the built app
        shell: pwsh
        run: |
          # A real CPU solve of a bundled photo against its golden output, exports and the
          # main window offscreen (pose_craft/selftest.py); no GPU on the runner is reported, not a failure.
          $p = Start-Process dist/PoseCraft/PoseCraft.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          Get-Content (Join-Path $env:TEMP 'PoseCraft-selftest.txt')
          exit $p.ExitCode

      - name: Zip
        shell: pwsh
        run: |
          $version = python -c "import pose_craft; print(pose_craft.__version__)"
          Compress-Archive -Path dist/PoseCraft -DestinationPath "PoseCraft-$version-${{ matrix.flavor }}-win64.zip"

      # The per-user installer (installer/PoseCraft.iss) next to the zip.
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          python scripts/build_installer.py --flavor ${{ matrix.flavor }}
          Move-Item dist/installer/PoseCraft-*-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: PoseCraft-${{ matrix.flavor }}
          path: |
            PoseCraft-*-win64.zip
            PoseCraft-*-setup.exe
          if-no-files-found: error

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One zip for both: an extension on Blender 4.2+ (blender_manifest.toml) and a
      # legacy add-on on 3.6-4.1 (bl_info).
      - name: Zip the Blender add-on
        run: python3 scripts/build_addon_zip.py --out .
      - uses: actions/upload-artifact@v4
        with:
          name: PoseCraft-addon
          path: posecraft-blender-addon-*.zip
          if-no-files-found: error

  release:
    needs: [build, addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.zip *.exe > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: PoseCraft-release
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.zip *.exe SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "PoseCraft ${{ github.ref_name }}" \
            --generate-notes
