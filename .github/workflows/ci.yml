name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      # requirements-test.txt only -- the full requirements.txt pulls PySide6/mediapipe,
      # and PySide6 in particular needs system Qt platform libraries (libEGL,
      # libxkbcommon-x11, ...) a plain Linux runner doesn't have. See that file's
      # own header comment for why each dependency is or isn't included here.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Compile check
        run: python -m compileall -q pose_craft

      - name: Run tests
        run: python -m pytest -q
