name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      # requirements-test.txt only -- the full requirements.txt pulls PySide6 (plus the
      # GPU build of ONNX Runtime), and PySide6 needs system Qt platform libraries
      # (libEGL, libxkbcommon-x11, ...) a plain Linux runner doesn't have; the Qt tests
      # skip here. See that file's own header comment for why each dependency is or
      # isn't included.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # The real-photo golden test (tests/test_real_photo_golden.py) needs the
      # pinned "full" model; cache it, keyed on the pinned URLs/hashes and the
      # converter, and fetch it only once golden photos are committed.
      - name: Cache the pose models
        if: hashFiles('tests/data/golden/*.golden.json') != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/pose_craft/models
          key: pose-models-${{ hashFiles('pose_craft/estimation/landmarker.py', 'pose_craft/estimation/tflite_to_onnx.py') }}

      - name: Fetch the pose model
        if: hashFiles('tests/data/golden/*.golden.json') != ''
        run: python -c "from pose_craft.estimation.landmarker import resolve_onnx_models; resolve_onnx_models('full')"

      - name: Compile check
        run: python -m compileall -q pose_craft

      - name: Run tests
        run: python -m pytest -q

  lint:
    # C3: ruff over everything, mypy over the pure modules (pyproject.toml has both configs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Ruff
        run: python -m ruff check pose_craft tests scripts

      - name: Mypy
        run: python -m mypy

  windows:
    # T6: the shipped platform, with PySide6 so the Qt tests run (offscreen) instead of
    # skipping, the CPU runtime (the GPU wheels add nothing on a runner without a GPU) and
    # coverage in the log. No artifact upload: the account's Actions storage is limited.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          # onnxruntime-gpu and onnxruntime install the same module; use the CPU build.
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install -r requirements-test.txt

      - name: Run tests with coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov=pose_craft --cov-report=term

  blender:
    # T4: the add-on, the FBX export and the library-to-Pose-Library path in a REAL headless
    # Blender -- 4.2 LTS, the add-on's minimum (blender_manifest.toml), pinned by its checksum.
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "4.2.23"
      BLENDER_SHA256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL -o "$archive" "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$archive"
          echo "${BLENDER_SHA256}  $archive" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf "$archive" -C ~/blender --strip-components=1

      - name: Blender's system libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6

      - name: Real-Blender tests
        run: |
          export POSECRAFT_BLENDER="$HOME/blender/blender"
          "$POSECRAFT_BLENDER" --version
          python -m pytest -q tests/test_real_blender.py tests/test_fbx_export.py tests/test_real_blender_library.py

  audit:
    # Known vulnerabilities in the pinned/required Python packages (OSV / PyPI advisory data).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off
